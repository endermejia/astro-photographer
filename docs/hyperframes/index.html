<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=1920, height=1080" />
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background: #20231f;
			}
			#root {
				position: relative;
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}
			.frame {
				position: absolute;
				inset: 0;
				opacity: 0;
			}
			.frame img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.frame.gallery img {
				object-position: center top;
			}
			.veil {
				position: absolute;
				inset: 0;
				background: linear-gradient(90deg, #20231fcc, transparent 65%);
			}
			.label {
				position: absolute;
				left: 104px;
				bottom: 100px;
				color: #f2eee7;
				font:
					500 62px Georgia,
					serif;
				letter-spacing: -0.05em;
			}
			.label em {
				color: #d46d46;
			}
			.meta {
				position: absolute;
				left: 108px;
				top: 76px;
				color: #f2eee7;
				font:
					13px Arial,
					sans-serif;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			.meta::before {
				content: '';
				display: inline-block;
				width: 9px;
				height: 9px;
				margin-right: 12px;
				border-radius: 50%;
				background: #d46d46;
			}
		</style>
	</head>
	<body>
		<div
			id="root"
			data-composition-id="portfolio"
			data-start="0"
			data-duration="8"
			data-width="1920"
			data-height="1080"
		>
			<div id="hero-frame" class="frame hero">
				<img src="assets/home-desktop.png" alt="Nhoa Sánchez portfolio desktop" />
				<div class="veil"></div>
				<div class="meta">Nhoa Sánchez / Fotografía</div>
				<div class="label">Lo que <em>permanece</em></div>
			</div>
			<div id="gallery-frame" class="frame gallery">
				<img src="assets/gallery-desktop.png" alt="Galería de eventos" />
				<div class="meta">Archivo / Eventos</div>
				<div class="label">Historias que <em>respiran</em></div>
			</div>
		</div>
		<script>
			const tl = gsap.timeline({ paused: true });
			tl.to('.hero', { opacity: 1, duration: 0.5 }, 0)
				.to('.hero img', { scale: 1.04, duration: 3.2, ease: 'power1.out' }, 0)
				.to('.hero .label, .hero .meta', { x: 24, opacity: 1, duration: 0.7, stagger: 0.12 }, 0.25)
				.to('.hero', { opacity: 0, duration: 0.6 }, 2.6)
				.to('.gallery', { opacity: 1, duration: 0.6 }, 2.8)
				.to('.gallery img', { scale: 1.035, duration: 5, ease: 'power1.out' }, 2.8)
				.to('.gallery .label, .gallery .meta', { x: 24, opacity: 1, duration: 0.7, stagger: 0.12 }, 3.1);
			window.__timelines['portfolio'] = tl;
			tl.seek(0);
		</script>
	</body>
</html>
